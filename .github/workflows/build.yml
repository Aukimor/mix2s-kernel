name: Build Polaris Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Aukimor/polaris
          kernel-branch: polaris-o-oss
          kernel-dir: kernel
          config: polaris_aukimor_defconfig
          arch: arm64
          other-gcc64-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          other-gcc64-branch: lineage-18.1
          other-gcc32-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
          other-gcc32-branch: lineage-18.1
          disable-lto: true
          extra-make-args: '["HOSTCFLAGS=-fcommon -O2"]'
          anykernel3: true
          anykernel3-url: https://github.com/Aukimor/polaris
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
