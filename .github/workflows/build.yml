name: Build Polaris Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Aukimor/polaris
          kernel-branch: polaris-o-oss
          kernel-dir: kernel
          config: polaris_user_defconfig
          arch: arm64
          aosp-gcc: true
          android-version: 9
          disable-lto: true
          merge-configs: '["https://raw.githubusercontent.com/Aukimor/mix2s-kernel/main/kernel.config"]'
          anykernel3: true
